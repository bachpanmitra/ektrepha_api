spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  liquibase:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  aws:
    s3:
      bucket: ${S3_BUCKET}
      region: ${S3_REGION}
  email:
    brevo:
      api-key: ${BREVO_API_KEY}
      sender-email: ${BREVO_SENDER_EMAIL}
      sender-name: ${BREVO_SENDER_NAME}
  firebase:
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH}
  startup:
    check-s3: ${STARTUP_CHECK_S3:true}
    seed-admin: ${STARTUP_SEED_ADMIN:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info