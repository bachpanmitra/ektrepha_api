spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ektrepha_api?options=-c%20TimeZone=UTC  #this line is changed
    username: postgres
    password: MyLocalDbPassword123
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef0123456789abcdef}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  # Same public OAuth web client the frontend uses; http://localhost:3000 must be
  # an Authorized JavaScript origin on it in Google Cloud Console.
  google:
    client-id: ${GOOGLE_CLIENT_ID:252559169200-i4joaqg4nojht9bltsdb3hf8o0re01no.apps.googleusercontent.com}
  aws:
    s3:
      # Placeholder values: the S3 connectivity check is off by default in dev
      # (see app.startup.check-s3 below), so these just need to be non-blank.
      bucket: ${S3_BUCKET:ektrepha-dev-local}
      region: ${S3_REGION:ap-south-1}
      # Most dev machines have no AWS credentials at all - real uploads (child photos, nanny
      # verification docs) would 500 on SdkClientException otherwise. Off by default here; set
      # S3_ENABLED=true once real credentials are exported into this environment.
      enabled: ${S3_ENABLED:false}
  # Placeholder values — OTP/notification emails will fail against the real Brevo
  # API without a real key, but the app still starts (dev otherwise just logs the
  # 401 from Brevo, same visibility as the old log-only stub had).
  email:
    brevo:
      api-key: ${BREVO_API_KEY:dev-placeholder-brevo-api-key}
      sender-email: ${BREVO_SENDER_EMAIL:no-reply@ektrepha.local}
      sender-name: ${BREVO_SENDER_NAME:Ektrepha}
  # Placeholder path — phone signup/reset will fail until this points to a real
  # Firebase service account JSON key, but the app still starts (the verifier
  # logs a warning and initializes lazily rather than crashing on boot).
  firebase:
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:secrets/firebase-service-account.json}
  # Placeholder values — mobile OTP SMS will fail against the real MSG91 API without a real key,
  # but the app still starts. fixed-otp is enabled by default here (dev only) with two allowlisted
  # test numbers (one PARENT, one NANNY — see nanny(id=1)/users(id=4) in the seed data), so both
  # the parent app's and the nanny app's login can be exercised end-to-end without any MSG91
  # credentials at all. The staff-otp flow (com.ektrepha.auth.staff) reuses this same allowlist.
  sms:
    msg91:
      auth-key: ${MSG91_AUTH_KEY:dev-placeholder-msg91-auth-key}
      template-id: ${MSG91_TEMPLATE_ID:dev-placeholder-template-id}
      otp-variable-name: ${MSG91_OTP_VARIABLE_NAME:OTP}
      sender-id: ${MSG91_SENDER_ID:}
  mobile-otp:
    fixed-otp:
      enabled: ${MOBILE_OTP_FIXED_ENABLED:true}
      code: ${MOBILE_OTP_FIXED_CODE:123456}
      allowed-numbers: ${MOBILE_OTP_FIXED_ALLOWED_NUMBERS:+919999999999,+919000000002}
  # Real Razorpay TEST-mode credentials (see com.ektrepha.payment) — order creation and webhook
  # signature verification were both verified end-to-end against these on 2026-09-26. Test-mode
  # only, no real money moves, but still a real account credential — rotate in the Razorpay
  # dashboard if this ever needs to be invalidated. webhook-secret stays blank: no webhook is
  # actually registered in the Razorpay dashboard yet (blocked on account KYC), so there's no real
  # secret to put here — set RAZORPAY_WEBHOOK_SECRET once one exists.
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_TgbvOE6KmysOf2}
    key-secret: ${RAZORPAY_KEY_SECRET:5KtIwAw6G2xhFlJbfhkwVBZO}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  startup:
    check-s3: ${STARTUP_CHECK_S3:false}
    seed-admin: ${STARTUP_SEED_ADMIN:true}
    seed-admin-email: ${SEED_ADMIN_EMAIL:admin@ektrepha.local}
    seed-admin-password: ${SEED_ADMIN_PASSWORD:ChangeMe123!}

management:
  endpoints:
    web:
      exposure:
        include: health,info
