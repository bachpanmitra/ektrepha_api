spring:
  application:
    name: ektrepha
  profiles:
    active: dev
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  # Default 1MB (per-file)/10MB (per-request) is too tight for a phone-camera photo — child
  # profile photo upload is the first multipart endpoint that isn't a small admin CSV.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  otp:
    ttl-minutes: ${OTP_TTL_MINUTES:5}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
  # Mobile-number OTP login/auto-signup (see MobileOtpServiceImpl). Reuses app.otp above for the
  # challenge's own expiry/attempt-limit — these are the extra knobs specific to that flow.
  mobile-otp:
    resend-cooldown-seconds: ${MOBILE_OTP_RESEND_COOLDOWN_SECONDS:30}
    request-limit-per-number: ${MOBILE_OTP_REQUEST_LIMIT_PER_NUMBER:5}
    request-limit-window-minutes: ${MOBILE_OTP_REQUEST_LIMIT_WINDOW_MINUTES:60}
    request-limit-per-ip: ${MOBILE_OTP_REQUEST_LIMIT_PER_IP:20}
    request-limit-per-ip-window-minutes: ${MOBILE_OTP_REQUEST_LIMIT_PER_IP_WINDOW_MINUTES:60}
    session-hours: ${MOBILE_OTP_SESSION_HOURS:72}
    # Dev/stage-only bypass for allowlisted test numbers — safe, do-nothing default (disabled).
    # MobileOtpFixedCodeGuard fails startup outright if this is ever true with the prod profile active.
    fixed-otp:
      enabled: ${MOBILE_OTP_FIXED_ENABLED:false}
      code: ${MOBILE_OTP_FIXED_CODE:123456}
      allowed-numbers: ${MOBILE_OTP_FIXED_ALLOWED_NUMBERS:}
    # A narrow, prod-safe bypass for a handful of explicitly allowlisted numbers (e.g. an App
    # Store/Play Store reviewer account) — safe, do-nothing default here; enabled per-profile below
    # where actually needed. Unlike fixed-otp, this one is allowed to be on in prod.
    review-account:
      enabled: ${MOBILE_OTP_REVIEW_ACCOUNT_ENABLED:false}
      code: ${MOBILE_OTP_REVIEW_ACCOUNT_CODE:123456}
      allowed-numbers: ${MOBILE_OTP_REVIEW_ACCOUNT_ALLOWED_NUMBERS:}
  login-lockout:
    max-failures: ${LOGIN_LOCKOUT_MAX_FAILURES:5}
    lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}
  # Coarse, per-client-IP token bucket applied to every request (see RateLimitFilter).
  # Default: burst of 60 requests, refilled continuously back to 60 over a minute.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    capacity: ${RATE_LIMIT_CAPACITY:60}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  # Safe, do-nothing defaults for any profile that doesn't override them below.
  startup:
    check-s3: ${STARTUP_CHECK_S3:false}
    seed-admin: ${STARTUP_SEED_ADMIN:false}
  search:
    allowed-radii-km: ${SEARCH_ALLOWED_RADII_KM:2,5,10,20}
    default-page-size: ${SEARCH_DEFAULT_PAGE_SIZE:20}
    candidate-fetch-limit: ${SEARCH_CANDIDATE_FETCH_LIMIT:500}
  verification:
    # Daily at 3am by default — audit frequency is an ops tuning knob, not a code change.
    audit-cron: ${VERIFICATION_AUDIT_CRON:0 0 3 * * *}
  pricing:
    # Hard ceiling on static-rule-multiplier x dynamic-demand-multiplier so a weekend/holiday
    # surge stacked with a demand surge never compounds past this — the design doc's "surge
    # pricing news story" guardrail (open design question #6).
    combined-multiplier-cap: ${PRICING_COMBINED_MULTIPLIER_CAP:2.5}
    # Global recompute cadence for DemandSnapshotRecomputeJob — every enabled zone x service-type
    # shares this one cadence rather than each row's own dynamic_pricing_config.recompute_interval_mins.
    demand-recompute-interval-ms: ${PRICING_DEMAND_RECOMPUTE_INTERVAL_MS:600000}
  serviceability:
    # A coordinate search matching a zone further than this is treated as not serviceable,
    # rather than silently returning whatever the geographically nearest (but distant) zone is.
    max-zone-match-km: ${SERVICEABILITY_MAX_ZONE_MATCH_KM:50}
  geocoding:
    nominatim:
      base-url: ${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
      # Nominatim's usage policy requires a real identifying User-Agent — override per environment.
      user-agent: ${NOMINATIM_USER_AGENT:Ektrepha/1.0 (no-reply@ektrepha.local)}
      # Public-instance usage policy caps requests at 1/sec; geocode_cache means most queries never reach here twice.
      min-interval-millis: ${NOMINATIM_MIN_INTERVAL_MILLIS:1000}
      # Restrict free-text search to India — every zone this app serves is Indian, so an unrestricted
      # global search can match an ambiguous short query (e.g. "AECS") to an unrelated place abroad.
      country-codes: ${NOMINATIM_COUNTRY_CODES:in}
  # Ola Maps (https://maps.olakrutrim.com) — reverse-geocode/autocomplete/place-details behind
  # com.ektrepha.location, for post-login automatic care-location selection. api-key blank (the
  # default) registers NoopOlaMapsClient instead of a real one — every request then cleanly
  # returns "no suggestions" rather than failing, so the app still starts with no key configured.
  # daily-limit values are free-tier usage budgets — tune to the account's actual current Ola Maps
  # plan allowance; each is tracked independently via RateLimiterService (see LocationServiceImpl).
  ola-maps:
    api-key: ${OLA_MAPS_API_KEY:}
    base-url: ${OLA_MAPS_BASE_URL:https://api.olamaps.io}
    reverse-geocode:
      daily-limit: ${OLA_MAPS_REVERSE_GEOCODE_DAILY_LIMIT:500}
    autocomplete:
      daily-limit: ${OLA_MAPS_AUTOCOMPLETE_DAILY_LIMIT:1000}
    place-details:
      daily-limit: ${OLA_MAPS_PLACE_DETAILS_DAILY_LIMIT:500}