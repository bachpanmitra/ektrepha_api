spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ektrepha_api
    username: postgres
    password: MyLocalDbPassword123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect


management:
  endpoints:
    web:
      exposure:
        include: health,info