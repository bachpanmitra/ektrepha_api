name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build jar
        run: ./mvnw -B -DskipTests package

      - name: Locate built jar
        id: jar
        run: |
          jar_path=$(find target -maxdepth 1 -name "*.jar" ! -name "*.jar.original" | head -n1)
          if [ -z "$jar_path" ]; then
            echo "No jar found in target/" >&2
            exit 1
          fi
          echo "path=$jar_path" >> "$GITHUB_OUTPUT"

      - name: Set up SSH key
        run: |
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload jar
        run: |
          scp -i ~/.ssh/deploy_key "${{ steps.jar.outputs.path }}" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/ektrepha.jar.new"

      - name: Swap jar and restart service
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" '
            set -e
            sudo mv ~/ektrepha.jar.new /opt/ektrepha/ektrepha.jar
            sudo chown ubuntu:ubuntu /opt/ektrepha/ektrepha.jar
            sudo systemctl restart ektrepha.service
          '

      - name: Read built version
        id: built
        run: |
          build_time=$(grep '^build.time=' target/classes/META-INF/build-info.properties | cut -d= -f2- | tr -d '\\')
          echo "time=$build_time" >> "$GITHUB_OUTPUT"

      - name: Wait for health check and verify deployed version
        run: |
          for i in $(seq 1 15); do
            if ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
              'curl -sf http://localhost:8080/api/health' > /dev/null; then
              deployed=$(ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
                'curl -sf http://localhost:8080/api/version')
              echo "Deployed version response: $deployed"
              if echo "$deployed" | grep -qF "${{ steps.built.outputs.time }}"; then
                echo "Deploy verified: prod is running the build from this workflow run"
                exit 0
              fi
              echo "App is UP but /api/version does not match the build just deployed" >&2
              exit 1
            fi
            sleep 4
          done
          echo "Health check failed after deploy" >&2
          exit 1
