spring:
  application:
    name: ektrepha
  profiles:
    active: dev
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  jwt:
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  otp:
    ttl-minutes: ${OTP_TTL_MINUTES:5}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
  login-lockout:
    max-failures: ${LOGIN_LOCKOUT_MAX_FAILURES:5}
    lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}
  # Coarse, per-client-IP token bucket applied to every request (see RateLimitFilter).
  # Default: burst of 60 requests, refilled continuously back to 60 over a minute.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    capacity: ${RATE_LIMIT_CAPACITY:60}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  # Safe, do-nothing defaults for any profile that doesn't override them below.
  startup:
    check-s3: ${STARTUP_CHECK_S3:false}
    seed-admin: ${STARTUP_SEED_ADMIN:false}
  search:
    allowed-radii-km: ${SEARCH_ALLOWED_RADII_KM:2,5,10,20}
    default-page-size: ${SEARCH_DEFAULT_PAGE_SIZE:20}
    candidate-fetch-limit: ${SEARCH_CANDIDATE_FETCH_LIMIT:500}
  verification:
    # Daily at 3am by default — audit frequency is an ops tuning knob, not a code change.
    audit-cron: ${VERIFICATION_AUDIT_CRON:0 0 3 * * *}
  pricing:
    # Hard ceiling on static-rule-multiplier x dynamic-demand-multiplier so a weekend/holiday
    # surge stacked with a demand surge never compounds past this — the design doc's "surge
    # pricing news story" guardrail (open design question #6).
    combined-multiplier-cap: ${PRICING_COMBINED_MULTIPLIER_CAP:2.5}
    # Global recompute cadence for DemandSnapshotRecomputeJob — every enabled zone x service-type
    # shares this one cadence rather than each row's own dynamic_pricing_config.recompute_interval_mins.
    demand-recompute-interval-ms: ${PRICING_DEMAND_RECOMPUTE_INTERVAL_MS:600000}
  serviceability:
    # A coordinate search matching a zone further than this is treated as not serviceable,
    # rather than silently returning whatever the geographically nearest (but distant) zone is.
    max-zone-match-km: ${SERVICEABILITY_MAX_ZONE_MATCH_KM:50}